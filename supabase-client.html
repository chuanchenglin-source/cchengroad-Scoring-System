<!--
  Supabase Client Library
  引入方式：在其他 HTML 檔的 <head> 加入 [?!= include('supabase-client') ?]
  透過 doGet 將 SUPABASE_URL / SUPABASE_ANON_KEY 注入模板
-->

<!-- Supabase JS SDK（CDN 載入）-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
    const SUPABASE_URL = '<?= supabaseUrl ?>';
    const SUPABASE_ANON_KEY = '<?= supabaseKey ?>';

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        console.error('[supabase-client] 缺少 Supabase URL / Key 環境設定');
        return;
    }

    // 建立 Supabase 客戶端（掛在全域，供其他 HTML 的 <script> 使用）
    window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =====================================================
    // scoringAPI：統一的資料存取介面
    // 封裝所有對 Supabase 的操作
    // =====================================================
    window.scoringAPI = {

        /**
         * 取得所有成員（用於 Index 頁面的姓名下拉選單）
         */
        async getMemberList() {
            // 依 squad_code (T010, T011, ...) 排序，同小隊內再依姓名
            // 對齊主程式設計師 0425 — 隊員列表照大隊→小隊→姓名展開
            const { data, error } = await window.sb
                .from('members_public')
                .select('*')
                .order('squad_code', { ascending: true })
                .order('name', { ascending: true });
            if (error) {
                console.error('[getMemberList]', error);
                return [];
            }
            return data || [];
        },

        /**
         * 取得某活動所有 box 定義與選項（供填表頁載入 UI）
         * 回傳：
         *   [{ id, box_no, week_no, category, title, note, input_type,
         *      multi_select, max_score, is_active, options: [{id, option_label, score_value, display_order}] }, ...]
         */
        async getBoxDefinitions(activityId = 1) {
            const { data, error } = await window.sb
                .from('box_definitions')
                .select(`
                    id, box_no, week_no, category, title, note,
                    input_type, multi_select, max_score, is_active,
                    options:box_options (id, option_label, score_value, display_order, is_active)
                `)
                .eq('activity_id', activityId)
                .eq('is_active', true)
                .order('box_no');
            if (error) {
                console.error('[getBoxDefinitions]', error);
                return [];
            }
            // 確保 options 按 display_order 排序（Supabase nested select 不保證順序）
            return (data || []).map(d => ({
                ...d,
                options: (d.options || [])
                    .filter(o => o.is_active !== false)
                    .sort((a, b) => (a.display_order || 0) - (b.display_order || 0))
            }));
        },

        /**
         * 儲存一筆填分紀錄（atomic 呼叫 save_daily_report RPC）
         * payload = {
         *   memberId, activityId=1, reportDate, totalScore, remarks,
         *   items: [
         *     { box_definition_id, score, content_text, selected_option_ids: [id, ...] }
         *   ]
         * }
         */
        async saveReport(payload) {
            // memberId 為 TEXT 格式 <squad_code>_<name>_<team_name>
            const memberId = (payload.memberId || '').toString().trim();
            if (!memberId) {
                return { success: false, error: '缺少 memberId' };
            }
            const { data, error } = await window.sb.rpc('save_daily_report', {
                p_member_id:    memberId,
                p_activity_id:  payload.activityId || 1,
                p_report_date:  payload.reportDate,
                p_total_score:  payload.totalScore || 0,
                p_remarks:      payload.remarks || null,
                p_items:        payload.items || []
            });
            if (error) {
                console.error('[saveReport]', error);
                return { success: false, error: error.message || String(error) };
            }
            return { success: true, reportId: data };
        },

        /**
         * 取得某使用者已填表的日期（供填分頁「已完成」標記）
         */
        async getCompletedDates(memberId) {
            const id = (memberId || '').toString().trim();
            if (!id) return [];
            const { data, error } = await window.sb
                .from('daily_reports')
                .select('report_date')
                .eq('member_id', id);
            if (error) {
                console.error('[getCompletedDates]', error);
                return [];
            }
            const unique = [...new Set((data || []).map(r => r.report_date))];
            return unique;
        },

        /**
         * 取得某使用者的完整歷史紀錄
         *
         * 讀取邏輯：
         *   1. 從 daily_reports 撈該 member 的所有報告
         *   2. 每筆 report 帶出所有 daily_report_items + 每個 item 的 selected options + box 定義
         *   3. 同一天多筆 → 只留最新（按 submitted_at DESC）
         *   4. 扁平化成舊格式（history.html 不需修改）：
         *      { date, score, remark, box1_score, box1_content, ..., box40_score, box40_content }
         */
        async getPersonalHistory(memberId) {
            const id = (memberId || '').toString().trim();
            if (!id) return [];
            const { data, error } = await window.sb
                .from('daily_reports')
                .select(`
                    id, report_date, total_score, remarks, submitted_at,
                    items:daily_report_items (
                        score, content_text,
                        box_definition:box_definitions!inner (box_no),
                        selections:daily_report_item_options (
                            option:box_options (option_label, display_order)
                        )
                    )
                `)
                .eq('member_id', id)
                .order('submitted_at', { ascending: false });

            if (error) {
                console.error('[getPersonalHistory]', error);
                return [];
            }

            // 同一天多筆 → 只保留最新（submitted_at DESC 排序後，第一筆即最新）
            const byDate = {};
            for (const report of (data || [])) {
                if (!byDate[report.report_date]) {
                    byDate[report.report_date] = report;
                }
            }

            // 扁平化
            return Object.values(byDate).map(report => {
                const flat = {
                    date:   report.report_date,
                    score:  report.total_score || 0,
                    remark: report.remarks || ''
                };

                // 初始化 40 格預設值
                for (let b = 1; b <= 40; b++) {
                    flat[`box${b}_score`]   = 0;
                    flat[`box${b}_content`] = '';
                }

                // 逐筆 item 填入對應的 box_no 欄位
                for (const item of (report.items || [])) {
                    const boxNo = item.box_definition && item.box_definition.box_no;
                    if (!boxNo) continue;

                    flat[`box${boxNo}_score`] = item.score || 0;

                    // content 決定：若有勾選選項 → 用選項標籤逗號串；否則用 content_text
                    const selections = (item.selections || [])
                        .map(s => s.option)
                        .filter(o => o && o.option_label)
                        .sort((a, b) => (a.display_order || 0) - (b.display_order || 0))
                        .map(o => o.option_label);
                    if (selections.length > 0) {
                        flat[`box${boxNo}_content`] = selections.join(',');
                    } else {
                        flat[`box${boxNo}_content`] = item.content_text || '';
                    }
                }

                return flat;
            });
        }
    };

    // =====================================================
    // adminAPI：管理後台專用介面
    // - 認證：sessionStorage 存 {admin_id, password}，每次 RPC 重驗
    // - 與 scoringAPI 完全區隔，scoringAPI 不含任何 admin method
    // =====================================================
    const SESSION_KEY = 'cchg_admin_session';

    function _readSession() {
        try {
            const raw = sessionStorage.getItem(SESSION_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    function _requireSession() {
        const s = _readSession();
        if (!s || !s.admin_id || !s.password) {
            throw new Error('未登入');
        }
        return s;
    }

    window.adminAPI = {

        /**
         * 登入：呼叫 admin_login RPC 驗證，成功則寫 sessionStorage
         * 回傳 { success, admin_id, name, error }
         */
        async login(adminId, password) {
            const id = (adminId || '').toString().trim();
            const pw = (password || '').toString();
            if (!id || !pw) {
                return { success: false, error: '請輸入帳號與密碼' };
            }
            const { data, error } = await window.sb.rpc('admin_login', {
                p_admin_id: id,
                p_password: pw
            });
            if (error) {
                console.error('[adminAPI.login]', error);
                return { success: false, error: error.message || String(error) };
            }
            if (!data || data.length === 0) {
                return { success: false, error: '帳號或密碼錯誤，或帳號已停用' };
            }
            const row = data[0];
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                admin_id: row.admin_id,
                name: row.name,
                password: pw
            }));
            return { success: true, admin_id: row.admin_id, name: row.name };
        },

        /**
         * 登出：清 sessionStorage
         */
        logout() {
            sessionStorage.removeItem(SESSION_KEY);
        },

        /**
         * 取得目前 session（不含密碼）
         */
        getSession() {
            const s = _readSession();
            if (!s) return null;
            return { admin_id: s.admin_id, name: s.name };
        },

        // -----------------------------------------------------
        // Admin 自管：listAdmins / createAdmin / setAdminActive / changePassword
        // -----------------------------------------------------

        async listAdmins() {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_list_admins', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password
            });
            if (error) throw new Error(error.message || String(error));
            return data || [];
        },

        async createAdmin(newAdminId, newName, newPassword) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_create', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_new_admin_id: (newAdminId || '').toString().trim(),
                p_new_name: (newName || '').toString().trim(),
                p_new_password: (newPassword || '').toString()
            });
            if (error) throw new Error(error.message || String(error));
            return data;
        },

        async setAdminActive(targetAdminId, setActive) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_set_active', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_target_admin_id: targetAdminId,
                p_set_active: !!setActive
            });
            if (error) throw new Error(error.message || String(error));
            return data;
        },

        async changePassword(targetAdminId, newPassword) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_change_password', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_target_admin_id: targetAdminId,
                p_new_password: (newPassword || '').toString()
            });
            if (error) throw new Error(error.message || String(error));
            // 若改的是自己的密碼，更新 sessionStorage
            if (targetAdminId === s.admin_id) {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                    admin_id: s.admin_id,
                    name: s.name,
                    password: newPassword
                }));
            }
            return data;
        },

        // -----------------------------------------------------
        // 權限矩陣：listPermissions / updatePermission
        // -----------------------------------------------------

        async listPermissions() {
            _requireSession();
            const { data, error } = await window.sb
                .from('permission_matrix')
                .select('*')
                .order('role')
                .order('capability');
            if (error) throw new Error(error.message || String(error));
            return data || [];
        },

        async updatePermission(role, capability, isEnabled, scope) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_update_permission', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_role: role,
                p_capability: capability,
                p_is_enabled: !!isEnabled,
                p_scope: scope || null
            });
            if (error) throw new Error(error.message || String(error));
            return data;
        },

        // -----------------------------------------------------
        // 計分規則：listScoringRules / updateScoringRule
        // -----------------------------------------------------

        async listScoringRules() {
            _requireSession();
            const { data, error } = await window.sb
                .from('scoring_rules')
                .select('*')
                .order('category')
                .order('rule_key');
            if (error) throw new Error(error.message || String(error));
            return data || [];
        },

        async updateScoringRule(ruleKey, ruleValue) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_update_scoring_rule', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_rule_key: ruleKey,
                p_rule_value: ruleValue
            });
            if (error) throw new Error(error.message || String(error));
            return data;
        },

        // -----------------------------------------------------
        // 名單管理：listMembersFull / setMemberRole / setMemberActive
        // -----------------------------------------------------

        async listMembersFull() {
            _requireSession();
            const { data, error } = await window.sb
                .from('members')
                .select(`
                    id, name, role, is_active, mentor,
                    squad:squads (squad_code, squad_name, squad_leader_name,
                        team:teams (team_code, team_name))
                `)
                .order('id');
            if (error) throw new Error(error.message || String(error));
            // 扁平化方便 UI 渲染
            return (data || []).map(m => ({
                id: m.id,
                name: m.name,
                role: m.role,
                is_active: m.is_active,
                mentor: m.mentor,
                squad_code: m.squad && m.squad.squad_code,
                squad_name: m.squad && m.squad.squad_name,
                squad_leader_name: m.squad && m.squad.squad_leader_name,
                team_code: m.squad && m.squad.team && m.squad.team.team_code,
                team_name: m.squad && m.squad.team && m.squad.team.team_name
            }));
        },

        async setMemberRole(memberId, newRole) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_set_member_role', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_member_id: memberId,
                p_new_role: newRole
            });
            if (error) throw new Error(error.message || String(error));
            return data;
        },

        async setMemberActive(memberId, isActive) {
            const s = _requireSession();
            const { data, error } = await window.sb.rpc('admin_set_member_active', {
                p_acting_admin_id: s.admin_id,
                p_acting_password: s.password,
                p_member_id: memberId,
                p_is_active: !!isActive
            });
            if (error) throw new Error(error.message || String(error));
            return data;
        }
    };

    console.log('[supabase-client] 已就緒');
})();
</script>
